<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Torresmo Delivery</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="card shadow" style="width: 100%; max-width: 400px;">
    <div class="card-header bg-danger text-white text-center py-4">
      <h4 class="mb-0 fw-bold">🐷 Torresmo Delivery</h4>
      <small class="opacity-75">Entre na sua conta</small>
    </div>
    <div class="card-body p-4">

      <div th:if="${param.error}" class="alert alert-danger" role="alert">
        E-mail ou senha incorretos.
      </div>
      <div th:if="${param.logout}" class="alert alert-success" role="alert">
        Você saiu da sua conta.
      </div>
      <div th:if="${param.registrado}" class="alert alert-success" role="alert">
        Conta criada! Entre com seu e-mail e senha.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="voce@exemplo.com"
            required
            autofocus />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required />
        </div>
        <button type="submit" class="btn btn-danger w-100">Entrar</button>
      </form>
    </div>
    <div class="card-footer text-center small">
      Não tem conta? <a th:href="@{/registro}" class="link-danger">Cadastre-se</a>
      <span class="text-muted mx-1">·</span>
      <a th:href="@{/}" class="text-muted">Voltar para a loja</a>
    </div>
  </div>

</body>
</html>
