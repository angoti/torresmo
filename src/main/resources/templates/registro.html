<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta — Torresmo Delivery</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="card shadow" style="width: 100%; max-width: 440px;">
    <div class="card-header bg-danger text-white text-center py-4">
      <h4 class="mb-0 fw-bold">🐷 Torresmo Delivery</h4>
      <small class="opacity-75">Crie sua conta</small>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/registro}" th:object="${registroForm}" method="post">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input th:field="*{nome}" type="text" class="form-control" th:errorclass="is-invalid"
                 maxlength="100" required autofocus />
          <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input th:field="*{email}" type="email" class="form-control" th:errorclass="is-invalid"
                 placeholder="voce@exemplo.com" required />
          <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input th:field="*{senha}" type="password" class="form-control" th:errorclass="is-invalid"
                 minlength="6" required />
          <div class="form-text" th:unless="${#fields.hasErrors('senha')}">Mínimo de 6 caracteres.</div>
          <div class="invalid-feedback" th:errors="*{senha}"></div>
        </div>
        <div class="mb-4">
          <label for="confirmacaoSenha" class="form-label">Confirme a senha</label>
          <input th:field="*{confirmacaoSenha}" type="password" class="form-control" th:errorclass="is-invalid"
                 required />
          <div class="invalid-feedback" th:errors="*{confirmacaoSenha}"></div>
        </div>
        <button type="submit" class="btn btn-danger w-100">Criar conta</button>
      </form>
    </div>
    <div class="card-footer text-center small">
      Já tem conta? <a th:href="@{/login}" class="link-danger">Entrar</a>
      <span class="text-muted mx-1">·</span>
      <a th:href="@{/}" class="text-muted">Voltar para a loja</a>
    </div>
  </div>

</body>
</html>
