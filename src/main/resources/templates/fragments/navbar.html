<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <nav th:fragment="navbar(color)" th:class="|navbar navbar-expand-lg navbar-dark bg-${color}|">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Torresmo Delivery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="nav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Cardápio</a></li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/pedido/acompanhar}">Acompanhar pedido</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" th:href="@{/admin}">Administrador</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" th:href="@{/admin/inline}">Admin inline</a>
            </li>
          </ul>
          <ul class="navbar-nav align-items-center gap-2">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/carrinho}">🛒 Carrinho</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="nav-link" th:href="@{/registro}">Criar conta</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Entrar</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                  Sair (<span sec:authentication="name"></span>)
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
